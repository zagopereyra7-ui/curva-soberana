# Corre diario.py de lunes a viernes a las 19:30 de Argentina (22:30 UTC), después del cierre,
# guarda en el repositorio lo que cambió (datos, normas nuevas, página) y publica docs/ en GitHub Pages.
name: Actualización diaria

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}        # botón para correrlo a mano

permissions:
  contents: write

concurrency:
  group: guardar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Correr el proceso diario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python diario.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "curva-soberana[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add datos fuentes docs
          git diff --cached --quiet || git commit -m "Actualización $(date -u +%F)"
          git pull --rebase && git push
