# Guarda las puntas (compra/venta) de los bonos durante la rueda: 16:00, 16:20 y 16:40 de Argentina.
# Un solo arranque a las 15:30 (18:30 UTC) que espera adentro hasta cada horario: GitHub atrasa los cron
# ~50 minutos y con un cron por foto solo entraba la última. puntas.py descarta fotos fuera de 15:45-17:00.
name: Puntas durante la rueda

on:
  schedule:
    - cron: "30,50 18 * * 1-5"   # dos arranques: GitHub a veces saltea corridas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guardar-datos          # no pisarse con otra corrida que también hace push
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python puntas.py --rueda
      - name: Guardar la foto
        run: |
          git config user.name "curva-soberana[bot]"
          git config user.email "actions@users.noreply.github.com"
          [ -d datos/puntas ] || { echo "Sin fotos nuevas."; exit 0; }
          git add datos/puntas
          git diff --cached --quiet || git commit -m "Puntas $(date -u +%F_%H%M)"
          git pull --rebase && git push
